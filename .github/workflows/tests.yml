name: CPU verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and CPU test dependencies
        run: python -m pip install -e '.[spatial]' 'pytest>=8.3,<10'
      - name: Analytic limits, data isolation, and regression tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest
