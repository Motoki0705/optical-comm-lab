[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "optical-comm-lab"
version = "0.1.0"
description = "Reproducible experiments on coherent optical communication"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "matplotlib>=3.10,<4",
  "numba>=0.61,<1",
]

[project.optional-dependencies]
gpu = ["cupy-cuda13x>=14.2,<15"]
spatial = ["scikit-image>=0.26,<0.27"]
transformer = ["torch==2.7.1"]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/optical_comm", "experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# CUDA 12.8 wheels include RTX 50-series (sm_120) support. This source applies
# only to the optional Transformer dependency; the base CPU study is unchanged.
[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
